<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Make it work, make it right, make it fast — Kent Beck">
<defs>
  
  <linearGradient id="ffill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".20"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".03"/>
  </linearGradient>
  <linearGradient id="frim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
    <stop offset=".3" stop-color="#fff" stop-opacity=".12"/>
    <stop offset=".7" stop-color="#fff" stop-opacity=".06"/>
    <stop offset="1" stop-color="#bfe3ff" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="fsheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="fshadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity=".55"/>
  </filter>
  <filter id="fblurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="fblurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/><feColorMatrix type="saturate" values="1.5"/></filter>
  <clipPath id="fcard"><rect width="1000" height="150" rx="28"/></clipPath>
  <g id="fblobs">
    
    <circle cx="250" cy="70" r="120" fill="#1d4ed8">
      <animate attributeName="cx" values="250;390;250" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="70;80;70" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </circle>
    
    <circle cx="700" cy="90" r="120" fill="#7c3aed">
      <animate attributeName="cx" values="700;580;700" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="90;80;90" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </circle>
    
    <circle cx="500" cy="130" r="90" fill="#06b6d4">
      <animate attributeName="cx" values="500;580;500" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="130;90;130" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    </circle>
  </g>
</defs>
<g clip-path="url(#fcard)">
  <rect width="1000" height="150" fill="#030817"/>
  <use href="#fblobs" filter="url(#fblurL)"/>
  
  <clipPath id="fgclip"><rect x="180" y="33" width="640" height="84" rx="42"/></clipPath>
  <rect x="180" y="33" width="640" height="84" rx="42" fill="#0a1630" fill-opacity=".35" filter="url(#fshadow)"/>
  <g clip-path="url(#fgclip)">
    <use href="#fblobs" filter="url(#fblurS)" transform="translate(500 75) scale(1.18) translate(-500 -75)" opacity="0.7"/>
  </g>
  <rect x="180" y="33" width="640" height="84" rx="42" fill="url(#ffill)"/>
  <rect x="194" y="36" width="612" height="35.28" rx="36" fill="url(#fsheen)" opacity=".55"/>
  <rect x="180.75" y="33.75" width="638.5" height="82.5" rx="42" fill="none" stroke="url(#frim)" stroke-width="1.5"/>
  <text x="500" y="73" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f0f9ff" letter-spacing="-.2">Make it work. Make it right. Make it fast.</text>
  <text x="500" y="96" text-anchor="middle" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" fill="#dbeafe" fill-opacity=".85">— Kent Beck</text>
  <rect x=".5" y=".5" width="999" height="149" rx="28" fill="none" stroke="#9ecbff" stroke-opacity=".18"/>
</g>
</svg>